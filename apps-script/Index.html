<!doctype html><html><head><base target="_top"><style>body{font:16px Arial,sans-serif;background:#f2f6f8;color:#102b46;max-width:650px;margin:36px auto;padding:0 18px}main{background:white;padding:26px;border-radius:12px}h1{margin-top:0}label{display:block;margin:13px 0;font-size:14px}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd9df;border-radius:6px;margin-top:6px;font:inherit}button{background:#102b46;color:white;border:0;border-radius:6px;padding:12px 18px;font-weight:bold;cursor:pointer}.hide{display:none}.notice{background:#eaf3f4;padding:12px;border-radius:6px;font-size:13px}.urgent{background:#fff2e6;padding:12px}.status{margin-top:16px}</style></head><body><main><h1>KH-Tech Oy – yhteydenotto</h1><p class="notice">Tämä suojattu lomake lähettää yhteydenottopyynnön KH-Tech Oy:lle. Älä lisää arkaluonteisia henkilötietoja.</p><form id="form"><label>Nimi *<input name="name" required maxlength="120"></label><label>Sähköposti<input name="email" type="email" maxlength="160"></label><label>Puhelin<input name="phone" maxlength="40"></label><label>Paikkakunta<input name="location" maxlength="120"></label><label>Palvelu<select name="service"><option value="">Valitse</option><option>Huolto ja korjaus</option><option>Putkiasennukset</option><option>Verkostojen tasapainotus</option><option>Vesi- ja viemärisaneeraus</option><option>Muu</option></select></label><label>Kiireellisyys<select name="urgency"><option value="normal">Tavallinen</option><option value="soon">Pian</option><option value="urgent">Kiireellinen</option></select></label><div class="urgent">Kiireellinen pyyntö ei takaa välitöntä apua. Soita yrityksen julkiseen numeroon 040 073 6199.</div><label>Yhteydenottotapa<select name="method"><option value="phone">Puhelin</option><option value="email">Sähköposti</option></select></label><label>Kuvaus *<textarea name="description" required maxlength="3000" rows="5"></textarea></label><label style="position:absolute;left:-9999px">Jätä tyhjäksi<input name="honey" tabindex="-1" autocomplete="off"></label><label><input type="checkbox" name="consent" required style="display:inline;width:auto"> Olen lukenut tietosuojatiedot.</label><button>Lähetä yhteydenotto</button></form><p id="status" class="status" role="status"></p></main><script>document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const form=e.currentTarget;const f=Object.fromEntries(new FormData(form));const s=document.getElementById('status');s.textContent='Lähetetään…';google.script.run.withSuccessHandler(()=>{s.textContent='Pyyntö vastaanotettu. KH-Tech ottaa sinuun yhteyttä.';form.reset()}).withFailureHandler(err=>{s.textContent=err.message||'Lähetys epäonnistui. Soita 040 073 6199.'}).submitContact(f)});</script></body></html>
